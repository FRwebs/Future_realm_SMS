<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You are offline · FutureRealm SMS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7faf8; color: #0d2315; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 440px; padding: 32px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #435048; line-height: 1.6; margin: 0 0 22px; }
    button { background: #0d2315; color: #fff; border: 0; border-radius: 11px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>FutureRealm could not reach the internet. Anything you saved while offline is kept on this device and will be sent when the connection is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
