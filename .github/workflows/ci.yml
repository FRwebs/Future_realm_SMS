name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: futurerealm_sms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/futurerealm_sms?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/futurerealm_sms?schema=public
      APP_URL: http://localhost:3000
      NEST_API_URL: http://127.0.0.1:4000
      API_PORT: 4000
      JWT_SECRET: ci-secret-key
      DEMO_MODE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
